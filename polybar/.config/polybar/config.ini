[colors]
background = #181825
foreground = #cdd6f4
primary = #89b4fa
muted = #6c7086
red = #f38ba8
yellow = #f9e2af
pill = #1e1e2e
transparent = #00000000

[pill]
lcap = "%{B#00000000}%{F#1e1e2e}%{T3}%{T-}%{B#1e1e2e}%{F#cdd6f4} "
rcap = " %{B#00000000}%{F#1e1e2e}%{T3}%{T-}%{B-}%{F-}"

[bar/main]
width = 98%
height = 30pt
offset-x = 1%
offset-y = 6
background = ${colors.transparent}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=12;4
font-1 = JetBrainsMono Nerd Font:size=17;5
font-2 = JetBrainsMono Nerd Font:size=20;5
module-margin = 1
enable-ipc = true
modules-left = launcher network vpn
modules-center = bspwm
modules-right = target system volume date power

[module/launcher]
type = custom/script
exec = echo launcher
interval = 3600
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#89b4fa}%{T2} %{T-}%{F-}
click-left = rofi -show drun -modes drun,run

[module/bspwm]
type = internal/bspwm
format = <label-state>
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label-focused = %{T2}󰮯 %{T-}
label-focused-foreground = ${colors.yellow}
label-focused-padding = 0
label-occupied = %{T2}󰊠 %{T-}
label-occupied-padding = 0
label-empty = %{T2}󰊠 %{T-}
label-empty-foreground = ${colors.muted}
label-empty-padding = 0

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = ${pill.lcap}
format-connected-suffix = ${pill.rcap}
format-disconnected-prefix = ${pill.lcap}
format-disconnected-suffix = ${pill.rcap}
label-connected = %{T2}󰈀 %{T-}%local_ip%
label-disconnected = %{T2} %{T-}sin red

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-ip.sh
interval = 5
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#89b4fa}%{T2} %{T-}%{F-}%output%

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 2
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#f9e2af}%{T2} %{T-}%{F-}%output%

[module/volume]
type = internal/pulseaudio
use-ui-max = false
format-volume-prefix = ${pill.lcap}
format-volume-suffix = ${pill.rcap}
format-muted-prefix = ${pill.lcap}
format-muted-suffix = ${pill.rcap}
label-volume = %{T2} %{T-}%percentage%%
label-muted = %{T2} %{T-}mute
label-muted-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %H:%M
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %date%


[module/system]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 2
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}

[module/power]
type = custom/menu
expand-right = false
format = <menu><label-toggle>
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label-open = %{F#f38ba8}%{T2}󰐥%{T-}%{F-}
label-close = %{F#6c7086}%{T2}󰅖%{T-}%{F-}
label-separator = "  "
menu-0-0 = %{F#f38ba8}%{T2}󰐥%{T-}%{F-}
menu-0-0-exec = ~/.config/polybar/scripts/powermenu.sh poweroff
menu-0-1 = %{F#f9e2af}%{T2}󰜉%{T-}%{F-}
menu-0-1-exec = ~/.config/polybar/scripts/powermenu.sh reboot
menu-0-2 = %{F#cba6f7}%{T2}󰍃%{T-}%{F-}
menu-0-2-exec = ~/.config/polybar/scripts/powermenu.sh logout
menu-0-3 = %{F#94e2d5}%{T2}󰒲%{T-}%{F-}
menu-0-3-exec = ~/.config/polybar/scripts/powermenu.sh suspend
menu-0-4 = %{F#89b4fa}%{T2}󰌾%{T-}%{F-}
menu-0-4-exec = ~/.config/polybar/scripts/powermenu.sh lock
