[colors]
background = #181825
foreground = #cdd6f4
primary = #89b4fa
muted = #6c7086

[bar/main]
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=10;3
modules-left = launcher bspwm
modules-right = date

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-padding = 1

[module/launcher]
type = custom/text
content = 
content-foreground = ${colors.primary}
content-padding = 1
click-left = rofi -show drun -modes drun,run
