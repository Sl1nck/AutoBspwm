[colors]
background = #181825
foreground = #cdd6f4
primary = #89b4fa
muted = #6c7086
red = #f38ba8
yellow = #f9e2af
pill = #1e1e2e
transparent = #00000000

[pill]
lcap = "%{B#00000000}%{F#1e1e2e}%{T3}%{T-}%{B#1e1e2e}%{F#cdd6f4} "
rcap = " %{B#00000000}%{F#1e1e2e}%{T3}%{T-}%{B-}%{F-}"

[bar/main]
width = 98%
height = 24pt
offset-x = 1%
offset-y = 6
background = ${colors.transparent}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font:size=14;4
font-2 = JetBrainsMono Nerd Font:size=16;4
module-margin = 1
modules-left = launcher network vpn
modules-center = bspwm
modules-right = target cpu memory volume date power

[module/launcher]
type = custom/script
exec = echo launcher
interval = 3600
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#89b4fa}%{T2} %{T-}%{F-}
click-left = rofi -show drun -modes drun,run

[module/bspwm]
type = internal/bspwm
format = <label-state>
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label-focused = %{T2}󰮯 %{T-}
label-focused-foreground = ${colors.yellow}
label-focused-padding = 0
label-occupied = %{T2}󰊠 %{T-}
label-occupied-padding = 0
label-empty = %{T2}󰊠 %{T-}
label-empty-foreground = ${colors.muted}
label-empty-padding = 0

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = ${pill.lcap}
format-connected-suffix = ${pill.rcap}
format-disconnected-prefix = ${pill.lcap}
format-disconnected-suffix = ${pill.rcap}
label-connected = %{T2} %{T-}%local_ip%
label-disconnected = %{T2} %{T-}sin red

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-ip.sh
interval = 5
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#89b4fa}%{T2} %{T-}%{F-}%output%

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 2
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#f9e2af}%{T2} %{T-}%{F-}%output%
click-left = ~/.config/polybar/scripts/target-set.sh
click-right = ~/.config/polybar/scripts/target-set.sh --clear

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{T2} %{T-}%percentage%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{T2}󰍛 %{T-}%used%

[module/volume]
type = internal/pulseaudio
use-ui-max = false
format-volume-prefix = ${pill.lcap}
format-volume-suffix = ${pill.rcap}
format-muted-prefix = ${pill.lcap}
format-muted-suffix = ${pill.rcap}
label-volume = %{T2} %{T-}%percentage%%
label-muted = %{T2} %{T-}mute
label-muted-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %H:%M
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %date%

[module/power]
type = custom/script
exec = echo power
interval = 3600
format-prefix = ${pill.lcap}
format-suffix = ${pill.rcap}
label = %{F#f38ba8}%{T2} %{T-}%{F-}
click-left = ~/.config/polybar/scripts/powermenu.sh
