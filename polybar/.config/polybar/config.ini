[colors]
background = #181825
foreground = #cdd6f4
primary = #89b4fa
muted = #6c7086
red = #f38ba8
yellow = #f9e2af

[bar/main]
width = 98%
offset-x = 1%
offset-y = 6
radius = 14
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font:size=14;4
modules-left = launcher network vpn
modules-center = bspwm
modules-right = target cpu memory volume date power
module-margin = 1

[module/bspwm]
type = internal/bspwm
label-focused = %{T2}󰮯%{T-}
label-focused-foreground = ${colors.yellow}
label-focused-padding = 1
label-occupied = %{T2}󰊠%{T-}
label-occupied-padding = 1
label-empty = %{T2}󰊠%{T-}
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-padding = 1

[module/launcher]
type = custom/text
content = %{T2}%{T-}
content-foreground = ${colors.primary}
content-padding = 1
click-left = rofi -show drun -modes drun,run

[module/network]
type = internal/network
interface-type = wired
interval = 3
label-connected = %{T2}%{T-} %local_ip%
label-disconnected = %{T2}%{T-} sin red

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-ip.sh
interval = 5
label = %{T2}%{T-} %output%
label-foreground = ${colors.primary}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
label-volume = %{T2}%{T-} %percentage%%
label-muted = %{T2}%{T-} mute
label-muted-foreground = ${colors.muted}

[module/power]
type = custom/text
content = %{T2}%{T-}
content-foreground = ${colors.red}
content-padding = 1
click-left = ~/.config/polybar/scripts/powermenu.sh

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%

[module/cpu]
type = internal/cpu
interval = 2
label = %{T2}%{T-} %percentage%%

[module/memory]
type = internal/memory
interval = 3
label = %{T2}󰍛%{T-} %used%

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 2
label = %{T2}%{T-} %output%
label-foreground = ${colors.yellow}
label-padding = 1
click-left = ~/.config/polybar/scripts/target-set.sh
click-right = ~/.config/polybar/scripts/target-set.sh --clear
